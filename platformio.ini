[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
# Use the repository `src/` folder for Arduino sources. Removing `src_dir`
# ensures PlatformIO converts `.ino` files found under `src/` correctly.
# Default: keep TinyML disabled for builds. To enable on-device TFLM set
# `build_flags = -DUSE_TFLM=1` and add a compatible Arduino TFLM library to
# `lib_deps` (example instructions in TFLM_INSTRUCTIONS.md).
build_flags = -DUSE_TFLM=0  ; set to 1 to enable TinyML device inference
; Reduce static check noise by excluding third-party driver folders (cppcheck)
check_tool = cppcheck
check_flags = --enable=warning,style,performance,portability --inline-suppr -i src/MPU6050 -i src/MPU9250 -i src/SBUS

