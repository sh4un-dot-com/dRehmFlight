name: CI

on:
  push:
    branches: [ master, feature/ai-complete ]
  pull_request:
    branches: [ master ]

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install venv deps
        run: python -m pip install --upgrade pip
      - name: Python syntax check for tools
        run: |
          python -m py_compile tools/*.py
      - name: Run Bayesian optimizer smoke test (simulation)
        run: |
          python tools/test_autoopt_bayes.py

  platformio-build:
    runs-on: ubuntu-latest
    needs: python-checks
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and PlatformIO
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build (Teensy 4.0)
        run: |
          pio run -e teensy40
